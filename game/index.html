<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAINLINE — a rainy-night getaway in Port Vane</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="RAINLINE: drive the getaway car through rainy Port Vane, outrun the police and run Vera's four jobs"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script>
  // Collect page errors for the test harness; the game itself never throws on purpose.
  window.__errors = [];
  window.addEventListener('error', function (e) { window.__errors.push(String(e.message || e.error) + ' || ' + String((e.error && e.error.stack) || '')); });
  window.addEventListener('unhandledrejection', function (e) { window.__errors.push('rejection: ' + String(e.reason)); });
</script>
<script type="module">
  import { createGame } from './src/main.js';
  const canvas = document.getElementById('game');
  function fit() {
    const scale = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    canvas.style.width = Math.floor(1280 * scale) + 'px';
    canvas.style.height = Math.floor(720 * scale) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
  createGame(canvas);
</script>
</body>
</html>
